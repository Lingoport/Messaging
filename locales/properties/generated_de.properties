FigmaBasics.4Styles.Colorstyles.Howtocreat=So erstellen Sie Farbstile\nWählen Sie das Objekt aus, für das Sie einen Stil erstellen möchten, und klicken Sie im Eigenschaften-Panel auf das Stile-Symbol neben der Eigenschaft, die Sie speichern möchten. Klicken Sie auf das „+"-Symbol und geben Sie Ihrem Stil einen Namen.
