FigmaBasics.5SmartSelection.Smartselection.HowSmartSe=How Smart Selection works\nSmart Selection works automatically on any selection or group of 3 or more items with equal, uniform spacing. With items selected, you can adjust spacing, position, and size of all these items at once by dragging the pink handles.
