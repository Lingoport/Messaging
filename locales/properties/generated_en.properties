FigmaBasics.5SmartSelection.SmartSelec1=Smart Selection allows you to quickly adjust spacing between objects, create an uniform grid by a selection of objects, and rearrange objects within a grid layout. Think of grid layouts for inbox interfaces, news feeds, and photo galleries.
FigmaBasics.5SmartSelection.SeehowSmar=See how Smart Selection works with the two examples below.
FigmaBasics.5SmartSelection.1Adjustpos=1. Adjust position\nOn the app below, select the two photos on the right-side (dog on boat and holding hands) and use the circular handle to quickly swap their positions. Hold the shift key to multi-select.
FigmaBasics.5SmartSelection.2Adjustspa=2. Adjust spacing\nOn the app below, select all the dog photos (12) in the grid below and use the horizontal handles to quickly adjust their vertical spacing. Hold the shift key to multi-select
