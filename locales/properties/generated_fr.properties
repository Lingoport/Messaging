FigmaBasics.4Styles.TheStylesf=La fonctionnalité Styles vous permet de définir un ensemble de propriétés telles que la couleur, la police et les effets d\'un objet, réutilisables dans les designs de votre équipe. Toute modification des propriétés d\'un Style met instantanément à jour les objets qui l\'utilisent.
FigmaBasics.4Styles.1Createane=1. Créer un nouveau Style\nSélectionnez le texte de la 1ère bulle de discussion ci-dessous et créez un nouveau Style de texte à partir de celui-ci. Profitez-en également pour créer un Style de couleur à partir de la même sélection de texte.
FigmaBasics.4Styles.2ApplyingS=2. Application des styles\nVous remarquez que les 2e et 3e bulles de discussion ont un texte et une couleur différents ? Appliquez vos styles de texte et de couleur nouvellement créés pour les uniformiser.
