FigmaBasics.4Styles.Colorstyles.Howtocreat=Comment créer des styles de couleurs\nSélectionnez l\'objet pour lequel vous souhaitez créer un style et, dans le panneau Propriétés, cliquez sur l\'icône Styles à côté de la propriété à enregistrer. Cliquez sur l\'icône "+" et vous serez invité à nommer votre style.
FigmaBasics.4Styles.Textstyles.Howtocreat=Comment créer des styles de texte\nSélectionnez le texte pour lequel vous souhaitez créer un style et cliquez sur l\'icône Style dans les propriétés de texte du panneau Propriétés. Cliquez sur l\'icône "+" et vous serez invité à donner un nom à votre style.
